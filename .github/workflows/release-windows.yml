name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pyinstaller

      - name: Build CLI exe (DDBdownloader.exe)
        run: |
          pyinstaller --clean --noconfirm --onefile --name DDBdownloader DDBdownloader.py

      - name: Build GUI exe (DDBdownloader_gui.exe)
        run: |
          pyinstaller --clean --noconfirm --onefile --noconsole --name DDBdownloader_gui DDBdownloader_gui.py

      - name: Prepare release folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Force dist\DDBdownloader.exe release\
          Copy-Item -Force dist\DDBdownloader_gui.exe release\
          Copy-Item -Force README.md release\
          Copy-Item -Force .env.example release\

      - name: Create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $zip = "DDBdownloader-${tag}-windows.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path release\* -DestinationPath $zip
          Write-Host "Created $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDBdownloader-windows
          path: DDBdownloader-*-windows.zip

      - name: Create GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DDBdownloader-*-windows.zip
